packages:
  - "apps/*"

allowBuilds:
  esbuild: true
  # Copilot SDK resolves Koffi's pinned prebuilt optional package; never compile
  # downloaded native sources during workspace installation.
  koffi: false

# pnpm 10+ promotes ignored build scripts to a hard error in CI. Esbuild is the
# only allowed lifecycle: Vite/Vitest need its downloaded binary. The pinned
# Copilot SDK pulls in koffi, but this proof does not use its native lifecycle,
# so deny it explicitly and do not add it to onlyBuiltDependencies. The
# strict-dep-builds=false fallback covers the implicit install that `pnpm exec`
# runs as a dependency-status check in CI.
onlyBuiltDependencies:
  - esbuild
# SDK 1.0.16 forwards child stderr directly to the service process; retain it
# for startup diagnostics but suppress that unredacted output at the transport.
patchedDependencies:
  "@github/copilot-sdk@1.0.16": patches/@github__copilot-sdk@1.0.16.patch
strictDepBuilds: false
