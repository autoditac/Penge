# Continuous Integration
#
# All third-party actions are pinned to a full commit SHA, with the human-readable
# version on a trailing comment. Dependabot keeps both in sync (see
# `.github/dependabot.yml`).
#
# `container-images` builds every Containerfile on every PR and push, but
# never pushes (`push: false`) -- verification only, safe for forked PRs.
# `publish-images` re-builds and pushes to GHCR, but only runs on pushes to
# `main` (never on `pull_request`), so it never runs with a fork's
# credentials. It waits only on jobs that validate the images' own
# content (app code, web bundle, migrations, Containerfiles, lint/secret
# scan) -- not on the separate dbt/docs/backup-roundtrip/mcp-evals
# workflows, which validate orthogonal subsystems. See ADR-0044.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional Commit PR title
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, penge]
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            build
            ci
            perf
            revert
          requireScope: false

  lint-markdown:
    name: Markdown lint
    runs-on: [self-hosted, linux, x64, penge]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !**/CHANGELOG.md

  yaml-lint:
    name: YAML lint
    runs-on: [self-hosted, linux, x64, penge]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
        with:
          version: "0.7.3"
      - name: Run YAML lint
        run: uvx yamllint -s .

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: [self-hosted, linux, x64, penge]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks detect --no-banner --redact --verbose --source .

  bootstrap-smoke:
    name: Bootstrap smoke
    runs-on: [self-hosted, linux, x64, penge]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify required files
        run: |
          set -euo pipefail
          for f in README.md CONTRIBUTING.md SECURITY.md AGENTS.md \
                   .github/copilot-instructions.md \
                   .github/PULL_REQUEST_TEMPLATE.md \
                   .github/CODEOWNERS \
                   .github/dependabot.yml \
                   .gitignore .editorconfig; do
            if [ ! -f "$f" ]; then
              echo "missing: $f"; exit 1
            fi
          done
          echo "Bootstrap layout OK"

  web-ui:
    name: WebUI build, lint, test
    runs-on: [self-hosted, linux, x64, penge]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Enable corepack & pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.0.9 --activate
          pnpm --version
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Check generated API client is current
        run: |
          set -euo pipefail
          pnpm --filter @penge/web generate:api
          git diff --exit-code apps/web/src/api/schema.d.ts
      - name: Build WebUI
        run: pnpm --filter @penge/web build
      - name: Test WebUI
        run: pnpm --filter @penge/web test
      - name: Lint WebUI
        run: pnpm --filter @penge/web lint

  container-images:
    name: Container image build (${{ matrix.app }})
    runs-on: [self-hosted, linux, x64, penge]
    timeout-minutes: 15
    env:
      DOCKER_CONFIG: /tmp/penge-docker-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build application image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Containerfile
          push: false
          # Load the API image into the local daemon so the boot
          # smoke-test below can run it. Single-platform build, so `load`
          # is safe. Web needs no boot test, so skip the extra load there.
          load: ${{ matrix.app == 'api' }}
          # Build-only verification: BuildKit's default provenance
          # attestation is wasted work here (nothing is published).
          provenance: false
          tags: penge/${{ matrix.app }}:ci
      - name: Boot smoke-test (api)
        if: matrix.app == 'api'
        # A successful `docker build` does not prove the app can import:
        # runtime dependencies missing from the image only surface when the
        # process starts. Importing the ASGI app exercises the full import
        # graph (including the connections router -> Enable Banking client)
        # without needing a database, so a missing runtime dep fails CI
        # instead of crash-looping in production. Guards #232.
        run: |
          docker run --rm penge/api:ci \
            python -c "import penge.api.app; print('api import OK')"
      - name: Remove Buildx builder
        if: always() && steps.buildx.outcome == 'success'
        run: docker buildx rm --force "${{ steps.buildx.outputs.name }}"

  publish-images:
    name: Publish image (${{ matrix.app }})
    # Only merges to `main` produce a deployable artifact; PR builds stay
    # verification-only (see the `container-images` job above), so forked
    # PRs never gain package-write credentials. See ADR-0044.
    #
    # `needs` covers every push-triggered job in this workflow that
    # validates the *content of the published images*: app/API code
    # (pytest), the web bundle (web-ui), the migration chain the API
    # runs on startup (alembic-roundtrip), the Containerfiles themselves
    # (container-images), plus lint/secret-scan hygiene. `pr-title` is
    # excluded -- it's PR-only and would report "skipped" (not
    # "success") on a push, permanently blocking this job.
    #
    # dbt.yml, docs.yml, backup-roundtrip.yml, and mcp-evals.yml also run
    # on this push, as separate workflow files that `needs:` cannot
    # reference. They are deliberately NOT gated on here: each validates
    # an orthogonal subsystem (dbt models, the docs site, backup/restore
    # scripts, MCP tool behaviour) that does not affect whether the
    # api/web container images are correct, and each already fails its
    # own workflow (docs' GitHub Pages deploy is itself gated on its
    # build job) independently of image publishing. See ADR-0044.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - lint-markdown
      - yaml-lint
      - gitleaks
      - bootstrap-smoke
      - web-ui
      - container-images
      - alembic-roundtrip
      - pytest
    runs-on: [self-hosted, linux, x64, penge]
    timeout-minutes: 20
    # Matrix jobs run concurrently under the same OS user on the runner VM.
    # Isolate Docker credentials so one job's post-action logout cannot remove
    # another job's GHCR credentials during provenance upload.
    env:
      DOCKER_CONFIG: /tmp/penge-docker-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.app }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Containerfile
          push: true
          sbom: true
          # Provenance is recorded once, via the explicit
          # actions/attest-build-provenance step below; BuildKit's
          # built-in attestation would be a second, divergent record.
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/penge/${{ matrix.app }}:main
            ghcr.io/${{ github.repository_owner }}/penge/${{ matrix.app }}:${{ github.sha }}

      - name: Re-login to GHCR (attestation push)
        # actions/attest-build-provenance pushes the attestation as a
        # separate OCI artifact and does its own registry-credential
        # lookup; on self-hosted runners the config.json written by the
        # login step above is not always still readable by the time this
        # step runs (docker/login-action#822). Logging in again
        # immediately before the attest step is the documented workaround.
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/penge/${{ matrix.app }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Remove Buildx builder
        if: always() && steps.buildx.outcome == 'success'
        run: docker buildx rm --force "${{ steps.buildx.outputs.name }}"

  alembic-roundtrip:
    name: Alembic round-trip
    runs-on: [self-hosted, linux, x64, penge]
    timeout-minutes: 10
    services:
      postgres:
        # postgres:17-alpine — same digest pinned in compose.yaml.
        image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_USER: penge
          POSTGRES_PASSWORD: penge
          POSTGRES_DB: penge
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U penge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install db deps
        run: uv sync --group db --frozen
      - name: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://penge:penge@localhost:${{ job.services.postgres.ports['5432'] }}/penge
        run: uv run --group db alembic upgrade head
      - name: alembic downgrade base
        env:
          DATABASE_URL: postgresql+psycopg://penge:penge@localhost:${{ job.services.postgres.ports['5432'] }}/penge
        run: uv run --group db alembic downgrade base
      - name: alembic upgrade head (idempotency check)
        env:
          DATABASE_URL: postgresql+psycopg://penge:penge@localhost:${{ job.services.postgres.ports['5432'] }}/penge
        run: uv run --group db alembic upgrade head

  pytest:
    name: pytest
    runs-on: [self-hosted, linux, x64, penge]
    timeout-minutes: 10
    services:
      postgres:
        # postgres:17-alpine — same digest pinned in compose.yaml.
        image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_USER: penge
          POSTGRES_PASSWORD: penge
          POSTGRES_DB: penge
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U penge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install OCR system deps (tesseract + poppler)
        # The PFA connector's OCR fallback path uses pytesseract +
        # pdf2image, which both shell out to native binaries. We
        # install the binaries here so the OCR tests can rasterise
        # fixtures and run Tesseract in CI.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-dan tesseract-ocr-deu poppler-utils
      - name: Install dev + db deps
        run: uv sync --group dev --group db --group http --group web --group manual --group enablebanking --group parsers --group ocr --group vault --group report --group api --frozen
      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://penge:penge@localhost:${{ job.services.postgres.ports['5432'] }}/penge
          PENGE_TEST_DATABASE_URL: postgresql+psycopg://penge:penge@localhost:${{ job.services.postgres.ports['5432'] }}/penge
        run: uv run --group dev --group db --group http --group web --group manual --group enablebanking --group parsers --group ocr --group vault --group report --group api pytest
