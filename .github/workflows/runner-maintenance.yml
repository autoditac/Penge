# Runner maintenance
#
# Operator-facing entry point for the Docker garbage collection described in
# docs/runbook/runner-maintenance.md. The authoritative schedule is the
# `penge-docker-gc.timer` systemd unit on the runner host, which keeps working
# when the runner itself is wedged (a full disk is exactly when Actions jobs
# stop running). This workflow adds a daily belt-and-braces sweep plus a
# manual, dry-runnable lever for operators without shell access to the host.
#
# All third-party actions are pinned to a full commit SHA, with the
# human-readable version on a trailing comment.

name: runner-maintenance

on:
  schedule:
    # 03:40 UTC, outside the nightly dbt/backup windows.
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would be removed without removing it"
        type: boolean
        default: false
      max-age-hours:
        description: "Only reclaim resources older than this many hours"
        type: string
        default: "2"
      update-age-hours:
        description: "Only remove a runner self-update payload idle this long"
        type: string
        default: "24"
      diag-retention-days:
        description: "Keep runner _diag logs for this many days"
        type: string
        default: "7"
      include-anonymous-volumes:
        description: "Also sweep leaked anonymous volumes (heuristic, see runbook)"
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel an in-flight sweep and never run two at once: concurrent
# `docker prune` calls race each other into spurious "no such image" errors.
concurrency:
  group: runner-maintenance
  cancel-in-progress: false

jobs:
  docker-gc:
    name: Docker garbage collection
    runs-on: [self-hosted, linux, x64, penge]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim stale Buildx builders, images and caches
        env:
          MAX_AGE_HOURS: ${{ inputs.max-age-hours || '2' }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          ANON_VOLUMES: ${{ inputs.include-anonymous-volumes && '--include-anonymous-volumes' || '' }}
        # Every removal in the script is age-bounded well beyond the longest
        # job timeout (30 min), so this is safe to run while other jobs build.
        run: |
          ./deploy/runner/docker-gc.sh --max-age-hours "$MAX_AGE_HOURS" $DRY_RUN $ANON_VOLUMES
      - name: Reclaim stale runner workspace leftovers
        env:
          UPDATE_AGE_HOURS: ${{ inputs.update-age-hours || '24' }}
          DIAG_DAYS: ${{ inputs.diag-retention-days || '7' }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        # Docker was only half of the disk exhaustion: the runner's own
        # `_work/_update` and `_diag` leftovers are the larger half.
        # Deliberately not `sudo` -- these files belong to the runner user,
        # and root would let a symlink redirect a removal out of the root.
        run: |
          ./deploy/runner/workspace-gc.sh \
            --update-age-hours "$UPDATE_AGE_HOURS" \
            --diag-retention-days "$DIAG_DAYS" $DRY_RUN
