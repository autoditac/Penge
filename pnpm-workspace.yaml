packages:
  - "apps/*"

allowBuilds:
  esbuild: true
  koffi: false

# pnpm 10+ promotes ignored build scripts to a hard error in CI. Esbuild is the
# only allowed lifecycle: Vite/Vitest need its downloaded binary. The pinned
# Copilot SDK pulls in koffi, but this proof does not use its native lifecycle,
# so deny it explicitly and do not add it to onlyBuiltDependencies. The
# strict-dep-builds=false fallback covers the implicit install that `pnpm exec`
# runs as a dependency-status check in CI.
onlyBuiltDependencies:
  - esbuild
strictDepBuilds: false
