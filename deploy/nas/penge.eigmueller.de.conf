# Tracked source of truth for /etc/nginx/conf.d/penge.eigmueller.de.conf.
# TLS certificate paths are managed by Certbot on the NAS.

server {
    server_name penge.eigmueller.de;

    client_max_body_size 25m;

    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto       $scheme;
        proxy_set_header X-Forwarded-Host        $host;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length    "";
        proxy_pass_request_body            off;
    }

    # The bank redirect must remain outside the Google authentication gate.
    location = /eb/callback {
        root  /var/www/penge-eb;
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    location ~ ^/(accounts|allocation|benchmarks|cashflow|connections|imports|meta|net-worth|returns)(/|$) {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User  $user;
        proxy_set_header X-Forwarded-Email $email;
    }

    # The SPA image handles history fallback internally. Keeping the container
    # bound to loopback means the host nginx remains the only public/auth gate.
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;

        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-User  $user;
        proxy_set_header X-Forwarded-Email $email;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/penge.eigmueller.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/penge.eigmueller.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = penge.eigmueller.de) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name penge.eigmueller.de;
    return 404;
}
