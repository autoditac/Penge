# Build the MkDocs Material site on every PR (--strict, as a quality gate)
# and deploy to GitHub Pages on every push to main.
#
# All third-party actions are pinned to a full commit SHA; Dependabot keeps
# both the SHA and the trailing version comment in sync.

name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (mkdocs --strict)
    runs-on: [self-hosted, linux, x64, penge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Install docs deps
        run: uv sync --only-group docs

      - name: mkdocs build --strict
        run: uv run mkdocs build --strict

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, penge]
    permissions:
      contents: write  # gh-deploy pushes to the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gh-deploy needs full history to fast-forward gh-pages

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Install docs deps
        run: uv sync --only-group docs

      - name: Configure git identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: mkdocs gh-deploy
        run: uv run mkdocs gh-deploy --force
