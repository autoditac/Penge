packages:
  - "apps/*"

allowBuilds:
  esbuild: true
  # Copilot SDK resolves Koffi's pinned prebuilt optional package; never compile
  # downloaded native sources during workspace installation.
  koffi: false

# pnpm 10+ promotes ignored build scripts to a hard error in CI. We only need
# the binary that esbuild's lifecycle script downloads (Vite/Vitest load TS
# through it), so allow-list it explicitly for both pnpm config generations. The
# strict-dep-builds=false fallback is a belt-and-braces guard for the implicit
# `pnpm install` that `pnpm exec` runs as a deps-status check in CI.
onlyBuiltDependencies:
  - esbuild
# SDK 1.0.16 forwards child stderr directly to the service process; retain it
# for startup diagnostics but suppress that unredacted output at the transport.
patchedDependencies:
  "@github/copilot-sdk@1.0.16": patches/@github__copilot-sdk@1.0.16.patch
strictDepBuilds: false
